---
# Gateway Service
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: microservices
  labels:
    app: gateway-service
    tier: frontend
    component: gateway
spec:
  type: NodePort
  selector:
    app: gateway-service
    tier: frontend
  ports:
  - name: http
    port: 80
    targetPort: 3000
    nodePort: 30000
    protocol: TCP
  - name: https
    port: 443
    targetPort: 3000
    nodePort: 30001
    protocol: TCP
  - name: health
    port: 3000
    targetPort: 3000
    protocol: TCP 