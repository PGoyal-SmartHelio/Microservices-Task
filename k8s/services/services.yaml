# User Service
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: microservices
  labels:
    app: user-service
    tier: backend
    component: service
spec:
  type: ClusterIP
  selector:
    app: user-service
    tier: backend
  ports:
  - name: http
    port: 3001
    targetPort: 3001
    protocol: TCP
  - name: health
    port: 3001
    targetPort: 3001
    protocol: TCP
---
