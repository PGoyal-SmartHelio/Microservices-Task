apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: microservices-ingress-direct
  namespace: microservices
  labels:
    app: microservices
    component: ingress-direct
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization"
spec:
  ingressClassName: nginx
  rules:
  - host: microservices.local
    http:
      paths:
      # Root path -> Gateway Service
      - path: /(.*)
        pathType: Prefix
        backend:
          service:
            name: gateway-service
            port:
              number: 80
      # /api/users -> User Service (direct)
      - path: /api/users(/|$)(.*)
        pathType: Prefix
        backend:
          service:
            name: user-service
            port:
              number: 3001
      # /api/products -> Product Service (direct)
      - path: /api/products(/|$)(.*)
        pathType: Prefix
        backend:
          service:
            name: product-service
            port:
              number: 3002
      # /api/orders -> Order Service (direct)
      - path: /api/orders(/|$)(.*)
        pathType: Prefix
        backend:
          service:
            name: order-service
            port:
              number: 3003
      # /health -> Gateway Service Health
      - path: /health(/|$)(.*)
        pathType: Prefix
        backend:
          service:
            name: gateway-service
            port:
              number: 3000 